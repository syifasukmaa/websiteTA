name: Laravel CI/CD

on:
  push:
    branches: ["main"]      # Menjalankan testing saat push ke branch main
    tags:
      - "v*.*.*"            # Menjalankan deploy saat push tag versi, contoh: v1.0.0, v1.0.1

jobs:
  # =======================================================
  # JOB 1: TESTING (Selalu jalan saat push main ATAU push tag)
  # =======================================================
  laravel-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: testing_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Database Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing_db
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan migrate --force

      - name: Run Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing_db
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan test

  # =======================================================
  # JOB 2: DEPLOY (HANYA BERJALAN JIKA ADA TAG VERSI)
  # =======================================================
  deploy:
    needs: laravel-test
    runs-on: self-hosted
    environment: SECRET
    # Syarat: Hanya jalan jika commit memiliki tag versi yang diawali 'v' (misal: v1.0.0)
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Deploy ke VPS
        run: |
          git config --global --add safe.directory ${{ secrets.FOLDER_VPS }}
          cd ${{ secrets.FOLDER_VPS }}

          php artisan down || true

          # Sinkronkan kode di server langsung ke tag terbaru
          git fetch origin --tags
          git reset --hard ${{ github.ref_name }}

          if git diff --name-only ORIG_HEAD HEAD | grep -qE "composer\.(json|lock)"; then
            composer install --no-dev --optimize-autoloader
          fi

          php artisan migrate --force

          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          php artisan up
          echo "🚀 Sukses deploy rilis versi ${{ github.ref_name }} ke server!"
